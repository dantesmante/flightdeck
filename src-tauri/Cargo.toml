[package]
name = "flightdeck"
description = "FlightDeck: a light, local-first flight tracker for MSFS and X-Plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flightdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
telemetry.workspace = true
tracker.workspace = true
store.workspace = true
refdata.workspace = true
conn-simconnect.workspace = true
conn-demo.workspace = true
watcher.workspace = true
tauri-plugin-opener = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["net", "sync", "macros"] }
getrandom = "0.3"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ureq = { version = "3", features = ["json", "platform-verifier", "win-system-proxy"] }
