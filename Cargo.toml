[workspace]
resolver = "2"
members = [
    "crates/telemetry",
    "crates/tracker",
    "crates/conn-demo",
    "crates/store",
    "crates/refdata",
    "crates/conn-simconnect",
    "crates/watcher",
    "tools/recorder",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-user/flightdeck"
rust-version = "1.80"

[workspace.dependencies]
telemetry = { path = "crates/telemetry" }
tracker = { path = "crates/tracker" }
store = { path = "crates/store" }
refdata = { path = "crates/refdata" }
conn-simconnect = { path = "crates/conn-simconnect" }
conn-demo = { path = "crates/conn-demo" }
watcher = { path = "crates/watcher" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = { version = "0.13", default-features = false }
libloading = "0.8"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
csv = "1"

[profile.release]
# Small, fast binary: this is the whole point of the project.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
